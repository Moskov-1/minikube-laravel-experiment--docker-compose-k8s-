services:
  # The Laravel Application
  app:
    build: .
    ports:
      # - "8000:80"
      # - "8080:8080" # for the php artisan serve command
      # - "80:8080" # for the php artisan serve command # with 80
      # - "80:9000"
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_NAME=dn

      # - DB_CONNECTION=mysql
      # - DB_HOST=db
      # - DB_PORT=3306

    env_file:
      - .env.compose

    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/.env.compose
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      # - "8080:80" # works but with port
      - "80:80" # works as well.
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - app

  # The Database (One DB requirement)
  db:
    image: mysql:8.0
    # environment:
    #   - MYSQL_DATABASE=${MYSQL_DATABASE}
    #   - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    env_file:
      - .env.compose
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
