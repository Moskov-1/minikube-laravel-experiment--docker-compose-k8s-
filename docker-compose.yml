services:
  # The Laravel Application
  app:
    build: .
    ports:
      # - "8000:80"
      - "8080:8080"
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_NAME=dn

      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306

    env_file:
      - .env.compose

    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

  # The Database (One DB requirement)
  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=laravel
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
